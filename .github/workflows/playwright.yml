name: Playwright Web, API and DB Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_suite:
        description: Select test suite (API uses the controlled CI service)
        type: choice
        options:
          - test:master
          - test:opencart
          - test:sanity
          - test:regression
          - test:e2e
          - test:api
          - test:web
          - test:db
          - test:datadriven
          - verify:allure-failure
        default: test:master
      browser:
        description: Select browser (headless)
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      allure-id: ${{ steps.raw.outputs.artifact-id }}
      test-attempt: ${{ github.run_attempt }}
    env:
      CI: 'true'
      APP_ENV: qa
      COMPOSE_PROJECT_NAME: opencart-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_SUITE: ${{ inputs.test_suite || 'test:master' }}
      TEST_BROWSER: ${{ inputs.browser || 'chromium' }}
      PLAYWRIGHT_TEST_IMAGE: opencart-playwright:${{ github.sha }}
      WEB_APP_URL: http://opencart/opencart/upload/
      DB_HOST: database
      DB_PORT: '3306'
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_EMAIL: ${{ secrets.APP_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      PRODUCT_NAME: ${{ vars.PRODUCT_NAME }}
      PRODUCT_QUANTITY: ${{ vars.PRODUCT_QUANTITY }}
      TOTAL_PRICE: ${{ vars.TOTAL_PRICE }}
      # Dedicated CI fixture target; local .env continues targeting the public API.
      API_BASE_URL: http://fakestore:6400
      USERNAME: ${{ secrets.FAKESTORE_CI_USERNAME }}
      PASSWORD: ${{ secrets.FAKESTORE_CI_PASSWORD }}
      USER_ID: '1'
      PRODUCT_ID: '1'
      CART_ID: '1'
      LIMIT: '3'
      START_DATE: '2020-01-01'
      END_DATE: '2020-03-02'
      FAKESTORE_PORT: '6400'
      FAKESTORE_JWT_SECRET: ${{ secrets.FAKESTORE_JWT_SECRET }}
      FAKESTORE_MONGO_PASSWORD: ${{ secrets.FAKESTORE_MONGO_PASSWORD }}
      FAKESTORE_MONGO_ROOT_PASSWORD: ${{ secrets.FAKESTORE_MONGO_ROOT_PASSWORD }}
      # Compose and Playwright must initialize and test the same accounts.
      OPENCART_PORT: '8080'
      OPENCART_HTTP_SERVER: http://localhost:8080/opencart/upload/
      OPENCART_DB_NAME: ${{ vars.DB_NAME }}
      OPENCART_DB_USER: ${{ vars.DB_USER }}
      OPENCART_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      OPENCART_DB_ROOT_PASSWORD: ${{ secrets.OPENCART_DB_ROOT_PASSWORD }}
      OPENCART_TEST_EMAIL: ${{ secrets.APP_EMAIL }}
      OPENCART_TEST_PASSWORD: ${{ secrets.APP_PASSWORD }}
      OPENCART_ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
      OPENCART_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      OPENCART_ADMIN_EMAIL: admin@example.test

    steps:
      - name: Require a trusted test source
        env:
          TRUSTED_SOURCE: >-
            ${{ github.actor != 'dependabot[bot]' &&
                (github.event_name != 'pull_request' ||
                 (github.event.pull_request.head.repo.full_name == github.repository &&
                  github.event.pull_request.user.login != 'dependabot[bot]')) }}
        run: |
          if [[ "$TRUSTED_SOURCE" != 'true' ]]; then
            echo '::error::Tests require a trusted same-repository source.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          check-latest: true

      - name: Validate required configuration
        id: validate
        run: node scripts/ci/validate-env.mjs --with-api

      - name: Check CI and local Docker configuration
        run: node --test scripts/ci/*.test.mjs

      - name: Resolve Playwright version from lockfile
        id: playwright
        run: node -p '"version=" + require("./package-lock.json").packages["node_modules/@playwright/test"].version' >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Playwright test image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/playwright/Dockerfile
          platforms: linux/amd64
          build-args: PLAYWRIGHT_VERSION=${{ steps.playwright.outputs.version }}
          load: true
          push: false
          tags: ${{ env.PLAYWRIGHT_TEST_IMAGE }}
          cache-from: type=gha,scope=playwright-linux-amd64
          cache-to: type=gha,scope=playwright-linux-amd64,mode=max

      - name: Exercise report privacy on passed, failed and retried tests
        run: docker run --rm --user "$(id -u):$(id -g)" --network none "$PLAYWRIGHT_TEST_IMAGE" node --test scripts/ci/regressions/report-privacy.test.mjs

      - name: Start fresh OpenCart, MySQL, FakeStore and MongoDB
        id: stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --project-name "$COMPOSE_PROJECT_NAME" up --build --wait --wait-timeout 300

      - name: Check FakeStore API and OpenCart URL helpers
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --project-name "$COMPOSE_PROJECT_NAME" exec -T fakestore npm test
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --project-name "$COMPOSE_PROJECT_NAME" exec -T opencart php /usr/local/lib/opencart/http-server.test.php

      - name: Require fresh CI report directories
        run: |
          for path in reports allure-results test-results; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo 'Refusing to upload a mixture of current and pre-existing test artifacts.' >&2
              exit 1
            fi
          done

      - name: Run Playwright web, API and database tests in Docker
        id: tests
        run: |
          if [[ "$TEST_SUITE" == 'verify:allure-failure' ]]; then
            # The controlled catalog has fewer than 999 products. Exercise one real assertion.
            LIMIT=999 bash scripts/ci/run-tests-in-docker.sh test:api "$TEST_BROWSER" \
              tests/api/products.spec.ts --grep 'GET - Products with limit @master' --retries=0
          else
            bash scripts/ci/run-tests-in-docker.sh "$TEST_SUITE" "$TEST_BROWSER"
          fi

      - name: Verify both diagnostic artifacts before upload
        id: privacy
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          test -f test-results/run/report-artifacts.ready
          python3 scripts/ci/verify-report-privacy.py reports allure-results

      - name: Upload HTML and JUnit reports
        if: ${{ !cancelled() && steps.privacy.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: reports/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Allure results
        id: raw
        if: ${{ !cancelled() && steps.privacy.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: error
          retention-days: 7

      - name: Remove this run's containers and volumes
        if: ${{ always() && steps.validate.outcome == 'success' }}
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --project-name "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans

  report:
    name: Build public Allure HTML
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.allure-id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      ALLURE_VERSION: 2.46.1
      ALLURE_SHA256: d25c519bbde940dc953cff8901130ce18b73013dc19a8f8b90b8b4b1c5eb252f
      ALLURE_NO_ANALYTICS: 'true'
      TEST_BROWSER: ${{ inputs.browser || 'chromium' }}
      TEST_ATTEMPT: ${{ needs.test.outputs.test-attempt }}
      PUBLISH_REPORT: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    outputs:
      name: ${{ steps.artifact.outputs.name }}
      artifact-url: ${{ steps.html.outputs.artifact-url }}
      publish: ${{ steps.ready.outputs.publish }}
      test-attempt: ${{ needs.test.outputs.test-attempt }}
    steps:
      - name: Checkout report tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified Allure results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.test.outputs.allure-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/raw-allure

      - name: Set up Node.js for reporting
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install report dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Discover public test names without credentials
        env:
          PRODUCT_ID: '1'
          USER_ID: '1'
          CART_ID: '1'
          LIMIT: '3'
          START_DATE: '2020-01-01'
          END_DATE: '2020-03-02'
        run: |
          if ! ./node_modules/.bin/playwright test --list --reporter=json --project="$TEST_BROWSER" > "$RUNNER_TEMP/catalog.json"; then
            echo '::warning::Test discovery failed. Publishing numbered cases.'
            printf '{"suites":[]}\n' > "$RUNNER_TEMP/catalog.json"
          fi

      - name: Prepare public Allure results
        run: node scripts/ci/public-allure.mjs "$RUNNER_TEMP/catalog.json" "$RUNNER_TEMP/raw-allure" "$RUNNER_TEMP/public-results" "$TEST_BROWSER"

      - name: Restore Allure archive cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/allure-cache
          key: allure-${{ runner.os }}-${{ env.ALLURE_VERSION }}-${{ env.ALLURE_SHA256 }}

      - name: Install Allure from a verified archive
        env:
          ALLURE_CACHE_DIR: ${{ runner.temp }}/allure-cache
          ALLURE_HOME: ${{ runner.temp }}/allure-cli
        run: bash scripts/ci/install-allure.sh

      - name: Generate browser-ready Allure HTML
        env:
          ALLURE_HOME: ${{ runner.temp }}/allure-cli
        run: |
          "$ALLURE_HOME/allure-$ALLURE_VERSION/bin/allure" generate --single-file \
            --name "Playwright run $GITHUB_RUN_ID (attempt $TEST_ATTEMPT)" \
            "$RUNNER_TEMP/public-results" -o "$RUNNER_TEMP/public-report"
          test -s "$RUNNER_TEMP/public-report/index.html"

      - name: Name report artifact
        id: artifact
        run: |
          prefix=allure-preview
          if [[ "$PUBLISH_REPORT" == 'true' ]]; then
            prefix=allure-html
          fi
          echo "name=$prefix-$GITHUB_RUN_ID-$TEST_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload browser-ready Allure report
        id: html
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/public-report/index.html
          if-no-files-found: error
          retention-days: 30

      - name: Mark report ready for publication
        id: ready
        run: echo "publish=$PUBLISH_REPORT" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Allure to GitHub Pages
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && needs.report.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: allure-github-pages
      queue: max
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      pull-requests: read
    environment:
      name: github-pages
      url: ${{ steps.summary.outputs.url }}
    steps:
      - name: Checkout publication tools and main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the executed helper pinned while fetching main's history for provenance.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble the last ten trusted reports
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_NAME: ${{ needs.report.outputs.name }}
        run: node scripts/ci/allure-pages.mjs "$RUNNER_TEMP/site" "$REPORT_NAME"
      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site

      - name: Check for an earlier deployment of this commit
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repeat=false
          previous=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$GITHUB_SHA" --jq '.status' 2>/dev/null || true)
          if [[ "$previous" == 'succeed' ]]; then
            repeat=true
          fi
          echo "repeat=$repeat" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: ${{ steps.previous.outputs.repeat == 'true' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify published HTML and link it from the run Summary
        id: summary
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          TEST_ATTEMPT: ${{ needs.report.outputs.test-attempt }}
          PAGES_DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          ALLOW_REPORT_FALLBACK: ${{ steps.previous.outputs.repeat }}
          REPORT_ARTIFACT_URL: ${{ needs.report.outputs.artifact-url }}
        run: bash scripts/ci/verify-pages.sh
